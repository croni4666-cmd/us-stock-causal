# Phase 9.0 POC + 9.1.2 + 9.1.7 batch 1+2+3: 手工因果 DAG (DOT format)
# 7 → 18 → 21 节点 (6 macro + 4 指数 + 11 行业)
#
# P9-1.7 batch 3 (v0.6.9j+k 重做): 加 3 国债 (^IRX 13W / ^FVX 5Y / ^TYX 30Y 完整 yield curve)
# 跟 ^TNX (10Y) 一起, 共 4 个 yield curve 节点
# 短端利率 (^IRX/^FVX) 对消费/金融/能源更敏感 (yield curve shape 相关)
# 长端利率 (^TYX) 跟 10Y 类似, 影响估值
# 完整 yield curve 让你能分析 "curve flattening/steepening" 对指数影响
# 中介链示例: ^IRX → XLF → QQQ (短端利率→金融股→纳指, 反映 bank NIM)
# 中介链示例: ^TYX → XLK → QQQ (长端利率→科技股→纳指, DCF 折现率)
#
# v0.6.9k (P9-1.5.5 升级): 21 节点 ≥ LARGE_DAG_THRESHOLD=20, L2 refutation 自动 0 重
# 21 节点 1 重 refutation 实测 175s 性能爆降 30x, 0 重 fallback ~3s. auto_reduce=True 默认.

dag_name: "Phase 9.0 + 9.1.2 + 9.1.7 batch 1+2+3: Macro + Yield Curve → Industry → Equity"

# DOT 格式 (graphviz), DoWhy / networkx / causal-learn 都吃
dot: |
  digraph causal_p9_17_b3 {
    // 节点 — macro (3) + yield curve (3) = 6 macro
    TNX [label="^TNX (10Y)"];
    IRX [label="^IRX (13W)"];
    FVX [label="^FVX (5Y)"];
    TYX [label="^TYX (30Y)"];
    VIX [label="^VIX"];
    DXY [label="DXY"];

    // 节点 — industry (11, P9-1.7 batch 1+2)
    XLK [label="XLK (Tech)"];
    XLF [label="XLF (Fin)"];
    XLV [label="XLV (Health)"];
    XLE [label="XLE (Energy)"];
    XLY [label="XLY (Cons Disc)"];
    XLP [label="XLP (Cons Stap)"];
    XLI [label="XLI (Industrial)"];
    XLU [label="XLU (Utility)"];
    XLB [label="XLB (Material)"];
    XLRE [label="XLRE (Real Estate)"];
    XLC [label="XLC (Comm Svc)"];

    // 节点 — index (4)
    DIA [label="DIA"];
    QQQ [label="QQQ"];
    RSP [label="RSP"];
    QQQE [label="QQQE"];

    // macro (3) → index (direct path, P9.0 已有)
    TNX -> DIA;
    TNX -> QQQ;
    TNX -> RSP;
    TNX -> QQQE;

    // P9-1.2 mediator: 利率 → 风险情绪 → 恐慌
    TNX -> VIX;

    // 风险偏好 (direct + VIX 传递间接)
    VIX -> DIA;
    VIX -> QQQ;
    VIX -> RSP;
    VIX -> QQQE;

    // 美元 (QQQ 受影响最大, 系数 QQQ > DIA/RSP/QQQE)
    DXY -> DIA;
    DXY -> QQQ;
    DXY -> RSP;
    DXY -> QQQE;

    // P9-1.7 batch 3: 3 国债 → 4 指数 (direct path, 跟 TNX 类似)
    IRX -> DIA;
    IRX -> QQQ;
    IRX -> RSP;
    IRX -> QQQE;
    FVX -> DIA;
    FVX -> QQQ;
    FVX -> RSP;
    FVX -> QQQE;
    TYX -> DIA;
    TYX -> QQQ;
    TYX -> RSP;
    TYX -> QQQE;

    // P9-1.7 batch 1+2: 3 macro (TNX/VIX/DXY) → 11 industry = 33 边
    TNX -> XLK; TNX -> XLF; TNX -> XLV; TNX -> XLE; TNX -> XLY; TNX -> XLP; TNX -> XLI; TNX -> XLU; TNX -> XLB; TNX -> XLRE; TNX -> XLC;
    VIX -> XLK; VIX -> XLF; VIX -> XLV; VIX -> XLE; VIX -> XLY; VIX -> XLP; VIX -> XLI; VIX -> XLU; VIX -> XLB; VIX -> XLRE; VIX -> XLC;
    DXY -> XLK; DXY -> XLF; DXY -> XLV; DXY -> XLE; DXY -> XLY; DXY -> XLP; DXY -> XLI; DXY -> XLU; DXY -> XLB; DXY -> XLRE; DXY -> XLC;

    // P9-1.7 batch 3: 3 国债 → 11 industry (跟 yield curve 完整 shape) = 33 边
    IRX -> XLK; IRX -> XLF; IRX -> XLV; IRX -> XLE; IRX -> XLY; IRX -> XLP; IRX -> XLI; IRX -> XLU; IRX -> XLB; IRX -> XLRE; IRX -> XLC;
    FVX -> XLK; FVX -> XLF; FVX -> XLV; FVX -> XLE; FVX -> XLY; FVX -> XLP; FVX -> XLI; FVX -> XLU; FVX -> XLB; FVX -> XLRE; FVX -> XLC;
    TYX -> XLK; TYX -> XLF; TYX -> XLV; TYX -> XLE; TYX -> XLY; TYX -> XLP; TYX -> XLI; TYX -> XLU; TYX -> XLB; TYX -> XLRE; TYX -> XLC;

    // P9-1.7 batch 1+2: 11 industry → 4 index = 44 边
    XLK -> DIA; XLK -> QQQ; XLK -> RSP; XLK -> QQQE;
    XLF -> DIA; XLF -> QQQ; XLF -> RSP; XLF -> QQQE;
    XLV -> DIA; XLV -> QQQ; XLV -> RSP; XLV -> QQQE;
    XLE -> DIA; XLE -> QQQ; XLE -> RSP; XLE -> QQQE;
    XLY -> DIA; XLY -> QQQ; XLY -> RSP; XLY -> QQQE;
    XLP -> DIA; XLP -> QQQ; XLP -> RSP; XLP -> QQQE;
    XLI -> DIA; XLI -> QQQ; XLI -> RSP; XLI -> QQQE;
    XLU -> DIA; XLU -> QQQ; XLU -> RSP; XLU -> QQQE;
    XLB -> DIA; XLB -> QQQ; XLB -> RSP; XLB -> QQQE;
    XLRE -> DIA; XLRE -> QQQ; XLRE -> RSP; XLRE -> QQQE;
    XLC -> DIA; XLC -> QQQ; XLC -> RSP; XLC -> QQQE;
  }

# P9-1.7 batch 3 query 示例 (yield curve):
#   - "13W 利率 (^IRX) ↑ 50bp, 金融股 (XLF) 涨多少?" → causal_query(IRX, XLF)
#   - "30Y 利率 (^TYX) ↑ 50bp, 科技股 (XLK) 跌多少?" → causal_query(TYX, XLK)
#   - "完整 yield curve ↑ 1% (parallel shift), QQQ 跌多少?" → 用 4 国债都查
#   - "Curve steepening (^TYX - ^IRX ↑), 哪些行业最敏感?" → cate_heterogeneity

# 节点元数据 (方便脚本映射 parquet 路径)
nodes:
  treatments: [TNX, IRX, FVX, TYX, VIX, DXY, XLK, XLF, XLV, XLE, XLY, XLP, XLI, XLU, XLB, XLRE, XLC]
  outcomes: [DIA, QQQ, RSP, QQQE]
  # P9-1.2: VIX 既是 treatment 又是 mediator
  mediators: [VIX]
  # P9-1.7 batch 3: 完整 yield curve (4 个国债: 13W/5Y/10Y/30Y)
  yield_curve: [IRX, FVX, TNX, TYX]
  # P9-1.7 batch 1+2: 11 行业全
  industries: [XLK, XLF, XLV, XLE, XLY, XLP, XLI, XLU, XLB, XLRE, XLC]
  parquet_map:
    TNX: "data/raw/macro/_TNX.parquet"
    IRX: "data/raw/macro/_IRX.parquet"
    FVX: "data/raw/macro/_FVX.parquet"
    TYX: "data/raw/macro/_TYX.parquet"
    VIX: "data/raw/macro/_VIX.parquet"
    DXY: "data/raw/macro/DXY.parquet"
    DIA: "data/raw/indices/DIA.parquet"
    QQQ: "data/raw/indices/QQQ.parquet"
    RSP: "data/raw/indices/RSP.parquet"
    QQQE: "data/raw/indices/QQQE.parquet"
    XLK: "data/raw/sectors/XLK.parquet"
    XLF: "data/raw/sectors/XLF.parquet"
    XLV: "data/raw/sectors/XLV.parquet"
    XLE: "data/raw/sectors/XLE.parquet"
    XLY: "data/raw/sectors/XLY.parquet"
    XLP: "data/raw/sectors/XLP.parquet"
    XLI: "data/raw/sectors/XLI.parquet"
    XLU: "data/raw/sectors/XLU.parquet"
    XLB: "data/raw/sectors/XLB.parquet"
