# Phase 9.0 POC + 9.1.2 + 9.1.7 batch 1+2+3+4+5: 手工因果 DAG (DOT format)
# 7 → 18 → 21 → 35 → 47 节点 (6 macro + 4 指数 + 11 行业 + 14 期货 + 12 现货 ETF)
#
# P9-1.7 batch 4 (v0.7.0): 加 14 商品期货 (4 贵金属 + 1 工业 + 3 能源 + 3 谷物 + 3 软商品)
# 边设计: 26 边 commodity → industry (按经济意义剪枝, 不加 direct commodity→index)
#   - 4 贵金属 (GC/SI/PL/PA) → XLB/XLE/XLF (13 边, 避险+对冲)
#   - 1 工业金属 (HG 铜) → XLB/XLI (2 边)
#   - 3 能源 (CL/BZ/NG) → XLE/XLU (5 边, 能源+电力)
#   - 3 谷物 (ZW/ZC/ZS) → XLP (3 边, 食品消费)
#   - 3 软商品 (SB/CT/KC) → XLP (3 边, 食品消费)
# 中介链示例: GC=F → XLB → DIA (黄金避险→材料股→道指)
#
# P9-1.7 batch 5 (v0.8.0): 加 12 现货 ETF (GLD/SLV/PPLT/PALL/CPER/USO/BNO/UNG/WEAT/CORN/SOYB/CANE)
# - 12 ETF 跟 14 期货 1:1 配对 (BAL/JO ETF delisted, 期货 CT_F/KC_F 已有)
# - 边设计: 12 ETF → 配对期货 (中介链), 不加 ETF → industry direct (避免重复 14 期货 → industry)
# - 中介链示例: GLD → GC_F → XLB (黄金 ETF → 黄金期货 → 材料股, basis = GLD price - GC=F price)
# - 中介链示例: USO → CL_F → XLE (原油 ETF → 原油期货 → 能源股, basis 反映 contango/backwardation)
#
# v0.6.9k (P9-1.5.5 升级): 21 节点 ≥ LARGE_DAG_THRESHOLD=20, L2 refutation 自动 0 重
# v0.6.9l (P9-1.5.5 升级): OLS refutation 路径, 3500x 加速, 保留 3 重验证
# 35 节点 L2 OLS 估计 < 200ms (vs DoWhy 21 节点 175s, 实际受 LARGE_DAG_THRESHOLD=20 + OLS 路径保)
# 47 节点 L2 OLS 估计 < 300ms (12 现货 ETF 走中介链, fit 几乎免费)

dag_name: "Phase 9.0 + 9.1.2 + 9.1.7 batch 1+2+3+4+5: Macro + Yield Curve + Commodities (Futures+Spot ETF) → Industry → Equity"

# DOT 格式 (graphviz), DoWhy / networkx / causal-learn 都吃
dot: |
  digraph causal_p9_17_b3 {
    // 节点 — macro (3) + yield curve (3) = 6 macro
    TNX [label="^TNX (10Y)"];
    IRX [label="^IRX (13W)"];
    FVX [label="^FVX (5Y)"];
    TYX [label="^TYX (30Y)"];
    VIX [label="^VIX"];
    DXY [label="DXY"];

    // 节点 — industry (11, P9-1.7 batch 1+2)
    XLK [label="XLK (Tech)"];
    XLF [label="XLF (Fin)"];
    XLV [label="XLV (Health)"];
    XLE [label="XLE (Energy)"];
    XLY [label="XLY (Cons Disc)"];
    XLP [label="XLP (Cons Stap)"];
    XLI [label="XLI (Industrial)"];
    XLU [label="XLU (Utility)"];
    XLB [label="XLB (Material)"];
    XLRE [label="XLRE (Real Estate)"];
    XLC [label="XLC (Comm Svc)"];

    // 节点 — index (4)
    DIA [label="DIA"];
    QQQ [label="QQQ"];
    RSP [label="RSP"];
    QQQE [label="QQQE"];

    // 节点 — commodity futures (14, P9-1.7 batch 4)
    // 4 贵金属
    GC_F [label="GC=F (Gold)"];
    SI_F [label="SI=F (Silver)"];
    PL_F [label="PL=F (Platinum)"];
    PA_F [label="PA=F (Palladium)"];
    // 1 工业金属
    HG_F [label="HG=F (Copper)"];
    // 3 能源
    CL_F [label="CL=F (WTI Crude)"];
    BZ_F [label="BZ=F (Brent)"];
    NG_F [label="NG=F (Nat Gas)"];
    // 3 谷物
    ZW_F [label="ZW=F (Wheat)"];
    ZC_F [label="ZC=F (Corn)"];
    ZS_F [label="ZS=F (Soybean)"];
    // 3 软商品
    SB_F [label="SB=F (Sugar)"];
    CT_F [label="CT=F (Cotton)"];
    KC_F [label="KC=F (Coffee)"];

    // 节点 — commodity spot ETF (12, P9-1.7 batch 5, 配对 12 期货, BAL/JO DELISTED)
    // 4 贵金属 ETF
    GLD [label="GLD (Gold ETF)"];
    SLV [label="SLV (Silver ETF)"];
    PPLT [label="PPLT (Platinum ETF)"];
    PALL [label="PALL (Palladium ETF)"];
    // 1 工业金属 ETF
    CPER [label="CPER (Copper ETF)"];
    // 3 能源 ETF
    USO [label="USO (WTI ETF)"];
    BNO [label="BNO (Brent ETF)"];
    UNG [label="UNG (Nat Gas ETF)"];
    // 3 谷物 ETF
    WEAT [label="WEAT (Wheat ETF)"];
    CORN [label="CORN (Corn ETF)"];
    SOYB [label="SOYB (Soybean ETF)"];
    // 1 软商品 ETF (BAL/JO DELISTED 跳过)
    CANE [label="CANE (Sugar ETF)"];

    // macro (3) → index (direct path, P9.0 已有)
    TNX -> DIA;
    TNX -> QQQ;
    TNX -> RSP;
    TNX -> QQQE;

    // P9-1.2 mediator: 利率 → 风险情绪 → 恐慌
    TNX -> VIX;

    // 风险偏好 (direct + VIX 传递间接)
    VIX -> DIA;
    VIX -> QQQ;
    VIX -> RSP;
    VIX -> QQQE;

    // 美元 (QQQ 受影响最大, 系数 QQQ > DIA/RSP/QQQE)
    DXY -> DIA;
    DXY -> QQQ;
    DXY -> RSP;
    DXY -> QQQE;

    // P9-1.7 batch 3: 3 国债 → 4 指数 (direct path, 跟 TNX 类似)
    IRX -> DIA;
    IRX -> QQQ;
    IRX -> RSP;
    IRX -> QQQE;
    FVX -> DIA;
    FVX -> QQQ;
    FVX -> RSP;
    FVX -> QQQE;
    TYX -> DIA;
    TYX -> QQQ;
    TYX -> RSP;
    TYX -> QQQE;

    // P9-1.7 batch 1+2: 3 macro (TNX/VIX/DXY) → 11 industry = 33 边
    TNX -> XLK; TNX -> XLF; TNX -> XLV; TNX -> XLE; TNX -> XLY; TNX -> XLP; TNX -> XLI; TNX -> XLU; TNX -> XLB; TNX -> XLRE; TNX -> XLC;
    VIX -> XLK; VIX -> XLF; VIX -> XLV; VIX -> XLE; VIX -> XLY; VIX -> XLP; VIX -> XLI; VIX -> XLU; VIX -> XLB; VIX -> XLRE; VIX -> XLC;
    DXY -> XLK; DXY -> XLF; DXY -> XLV; DXY -> XLE; DXY -> XLY; DXY -> XLP; DXY -> XLI; DXY -> XLU; DXY -> XLB; DXY -> XLRE; DXY -> XLC;

    // P9-1.7 batch 3: 3 国债 → 11 industry (跟 yield curve 完整 shape) = 33 边
    IRX -> XLK; IRX -> XLF; IRX -> XLV; IRX -> XLE; IRX -> XLY; IRX -> XLP; IRX -> XLI; IRX -> XLU; IRX -> XLB; IRX -> XLRE; IRX -> XLC;
    FVX -> XLK; FVX -> XLF; FVX -> XLV; FVX -> XLE; FVX -> XLY; FVX -> XLP; FVX -> XLI; FVX -> XLU; FVX -> XLB; FVX -> XLRE; FVX -> XLC;
    TYX -> XLK; TYX -> XLF; TYX -> XLV; TYX -> XLE; TYX -> XLY; TYX -> XLP; TYX -> XLI; TYX -> XLU; TYX -> XLB; TYX -> XLRE; TYX -> XLC;

    // P9-1.7 batch 1+2: 11 industry → 4 index = 44 边
    XLK -> DIA; XLK -> QQQ; XLK -> RSP; XLK -> QQQE;
    XLF -> DIA; XLF -> QQQ; XLF -> RSP; XLF -> QQQE;
    XLV -> DIA; XLV -> QQQ; XLV -> RSP; XLV -> QQQE;
    XLE -> DIA; XLE -> QQQ; XLE -> RSP; XLE -> QQQE;
    XLY -> DIA; XLY -> QQQ; XLY -> RSP; XLY -> QQQE;
    XLP -> DIA; XLP -> QQQ; XLP -> RSP; XLP -> QQQE;
    XLI -> DIA; XLI -> QQQ; XLI -> RSP; XLI -> QQQE;
    XLU -> DIA; XLU -> QQQ; XLU -> RSP; XLU -> QQQE;
    XLB -> DIA; XLB -> QQQ; XLB -> RSP; XLB -> QQQE;
    XLRE -> DIA; XLRE -> QQQ; XLRE -> RSP; XLRE -> QQQE;
    XLC -> DIA; XLC -> QQQ; XLC -> RSP; XLC -> QQQE;

    // P9-1.7 batch 4: 14 commodity → 11 industry = 26 边 (按经济意义剪枝)
    // 4 贵金属 → XLB/XLE/XLF (13 边, 避险+对冲)
    GC_F -> XLB; GC_F -> XLE; GC_F -> XLF;
    SI_F -> XLB; SI_F -> XLE; SI_F -> XLF;
    PL_F -> XLB; PL_F -> XLE; PL_F -> XLF;
    PA_F -> XLB; PA_F -> XLE; PA_F -> XLF;
    // 1 工业金属 (HG 铜) → XLB/XLI (2 边)
    HG_F -> XLB; HG_F -> XLI;
    // 3 能源 (CL/BZ/NG) → XLE/XLU (5 边, 能源+电力)
    CL_F -> XLE; CL_F -> XLU;
    BZ_F -> XLE;
    NG_F -> XLE; NG_F -> XLU;
    // 3 谷物 → XLP (3 边, 食品消费)
    ZW_F -> XLP;
    ZC_F -> XLP;
    ZS_F -> XLP;
    // 3 软商品 → XLP (3 边, 食品消费)
    SB_F -> XLP;
    CT_F -> XLP;
    KC_F -> XLP;

    // P9-1.7 batch 5: 12 spot ETF → 配对期货 (12 边, 中介链 basis = spot - future)
    // 4 贵金属 ETF
    GLD -> GC_F;
    SLV -> SI_F;
    PPLT -> PL_F;
    PALL -> PA_F;
    // 1 工业金属 ETF
    CPER -> HG_F;
    // 3 能源 ETF
    USO -> CL_F;
    BNO -> BZ_F;
    UNG -> NG_F;
    // 3 谷物 ETF
    WEAT -> ZW_F;
    CORN -> ZC_F;
    SOYB -> ZS_F;
    // 1 软商品 ETF
    CANE -> SB_F;
    // BAL/JO DELISTED, 期货 CT_F/KC_F 已在 batch 4 加, 不加 ETF 节点
  }

# P9-1.7 batch 3 query 示例 (yield curve):
#   - "13W 利率 (^IRX) ↑ 50bp, 金融股 (XLF) 涨多少?" → causal_query(IRX, XLF)
#   - "30Y 利率 (^TYX) ↑ 50bp, 科技股 (XLK) 跌多少?" → causal_query(TYX, XLK)
#   - "完整 yield curve ↑ 1% (parallel shift), QQQ 跌多少?" → 用 4 国债都查
#   - "Curve steepening (^TYX - ^IRX ↑), 哪些行业最敏感?" → cate_heterogeneity

