# us-stock-causal — ticker universe (v0.2.0)
#
# 总计 49 ticker (4 指数 + 11 行业 + 6 宏观 + 14 商品期货 + 14 商品现货尽力)
# 命名规范:
#   - 普通 ticker: DIA / QQQ / XLK / ^VIX / GC=F (OpenBB 会原样转发给 yfinance)
#   - 文件名: ^VIX -> _VIX.parquet, GC=F -> GC_F.parquet (filesystem safe,见 src/cache.py safe_name)

universe:

  # ============================================================
  # 1. 指数 (4) — 整体市场怎么走
  # ============================================================
  indices:
    - symbol: DIA
      name: SPDR Dow Jones Industrial Average ETF
      purpose: 道指 30 工业平均
    - symbol: QQQ
      name: Invesco QQQ Trust
      purpose: 纳斯达克 100
    - symbol: RSP
      name: Invesco S&P 500 Equal Weight ETF
      purpose: "S&P 500 等权重 (道指等权重的最接近代理,S&P 500 含 30 只道指成分股)"
    - symbol: QQQE
      name: ProShares Nasdaq-100 Equal Weighted
      purpose: 纳斯达克 100 等权重

  # ============================================================
  # 2. 行业 (11) — GICS 全 11 sector,State Street (XL*) 系列
  # ============================================================
  sectors:
    - symbol: XLK
      name: Technology Select Sector SPDR Fund
      gics: "Information Technology"
    - symbol: XLF
      name: Financial Select Sector SPDR Fund
      gics: "Financials"
    - symbol: XLE
      name: Energy Select Sector SPDR Fund
      gics: "Energy"
    - symbol: XLY
      name: Consumer Discretionary Select Sector SPDR Fund
      gics: "Consumer Discretionary"
    - symbol: XLP
      name: Consumer Staples Select Sector SPDR Fund
      gics: "Consumer Staples"
    - symbol: XLV
      name: Health Care Select Sector SPDR Fund
      gics: "Health Care"
    - symbol: XLI
      name: Industrials Select Sector SPDR Fund
      gics: "Industrials"
    - symbol: XLU
      name: Utilities Select Sector SPDR Fund
      gics: "Utilities"
    - symbol: XLB
      name: Materials Select Sector SPDR Fund
      gics: "Materials"
    - symbol: XLRE
      name: Real Estate Select Sector SPDR Fund
      gics: "Real Estate"
    - symbol: XLC
      name: Communication Services Select Sector SPDR Fund
      gics: "Communication Services"

  # ============================================================
  # 3. 宏观 (6) — 恐慌 + 美元 + 完整 yield curve
  # ============================================================
  macro:
    - symbol: ^VIX
      name: CBOE Volatility Index
      purpose: 恐慌指数
    - symbol: DXY
      name: U.S. Dollar Index
      purpose: 美元强弱
    - symbol: ^IRX
      name: 13-Week Treasury Bill Yield
      purpose: 国债 3M (短端)
    - symbol: ^FVX
      name: 5-Year Treasury Note Yield
      purpose: 国债 5Y (中段)
    - symbol: ^TNX
      name: 10-Year Treasury Note Yield
      purpose: 国债 10Y (长端,核心)
    - symbol: ^TYX
      name: 30-Year Treasury Bond Yield
      purpose: 国债 30Y (超长)

  # ============================================================
  # 4. 大宗商品 (14 期货 + 14 现货尽力)
  # ============================================================
  commodities:

    # 14 期货 (=F) — 连续合约,自动滚月
    futures:
      # 贵金属 4
      - symbol: GC=F
        name: Gold (COMEX)
        category: precious_metal
      - symbol: SI=F
        name: Silver (COMEX)
        category: precious_metal
      - symbol: PL=F
        name: Platinum (NYMEX)
        category: precious_metal
      - symbol: PA=F
        name: Palladium (NYMEX)
        category: precious_metal
      # 工业金属 1
      - symbol: HG=F
        name: Copper (COMEX)
        category: industrial_metal
      # 能源 3
      - symbol: CL=F
        name: WTI Crude Oil (NYMEX)
        category: energy
      - symbol: BZ=F
        name: Brent Crude Oil (ICE)
        category: energy
      - symbol: NG=F
        name: Natural Gas (NYMEX)
        category: energy
      # 谷物 3
      - symbol: ZW=F
        name: Wheat (CBOT)
        category: grain
      - symbol: ZC=F
        name: Corn (CBOT)
        category: grain
      - symbol: ZS=F
        name: Soybeans (CBOT)
        category: grain
      # 软商品 3
      - symbol: SB=F
        name: Sugar (ICE)
        category: soft_commodity
      - symbol: CT=F
        name: Cotton (ICE)
        category: soft_commodity
      - symbol: KC=F
        name: Coffee (ICE)
        category: soft_commodity

    # 14 现货 ETF 代理 (=X yfinance 不可用,改用 ETF 跟踪商品价格)
    # 1:1 跟踪商品 + 流动性好 + 连续合约(无展期噪音,只 ETF 管理费 ~0.5%/y)
    # 与 14 期货 (=F) 一一对应:
    #   GC=F  -> GLD  (黄金)
    #   SI=F  -> SLV  (白银)
    #   PL=F  -> PPLT (铂)
    #   PA=F  -> PALL (钯)
    #   HG=F  -> CPER (铜)
    #   CL=F  -> USO  (WTI 原油)
    #   BZ=F  -> BNO  (Brent 原油)
    #   NG=F  -> UNG  (天然气)
    #   ZW=F  -> WEAT (小麦)
    #   ZC=F  -> CORN (玉米)
    #   ZS=F  -> SOYB (大豆)
    #   SB=F  -> CANE (糖)
    #   CT=F  -> BAL  (棉花, iPath ETN)
    #   KC=F  -> JO   (咖啡, iPath ETN)
    # 基差 (basis) = futures price - ETF price,真正的市场预期信号
    spot_etf:
      - symbol: GLD
        name: SPDR Gold Shares
        category: precious_metal
        paired_future: GC=F
      - symbol: SLV
        name: iShares Silver Trust
        category: precious_metal
        paired_future: SI=F
      - symbol: PPLT
        name: abrdn Physical Platinum Shares ETF
        category: precious_metal
        paired_future: PL=F
      - symbol: PALL
        name: abrdn Physical Palladium Shares ETF
        category: precious_metal
        paired_future: PA=F
      - symbol: CPER
        name: United States Copper Index Fund
        category: industrial_metal
        paired_future: HG=F
      - symbol: USO
        name: United States Oil Fund
        category: energy
        paired_future: CL=F
      - symbol: BNO
        name: United States Brent Oil Fund
        category: energy
        paired_future: BZ=F
      - symbol: UNG
        name: United States Natural Gas Fund
        category: energy
        paired_future: NG=F
      - symbol: WEAT
        name: Teucrium Wheat Fund
        category: grain
        paired_future: ZW=F
      - symbol: CORN
        name: Teucrium Corn Fund
        category: grain
        paired_future: ZC=F
      - symbol: SOYB
        name: Teucrium Soybean Fund
        category: grain
        paired_future: ZS=F
      - symbol: CANE
        name: Teucrium Sugar Fund
        category: soft_commodity
        paired_future: SB=F
      - symbol: BAL
        name: iPath Cotton ETN (DELISTED 2018)
        category: soft_commodity
        paired_future: CT=F
        optional: true  # yfinance 不可用,Phase 2 用 CT=F 期货代理
      - symbol: JO
        name: iPath Coffee ETN (DELISTED 2018)
        category: soft_commodity
        paired_future: KC=F
        optional: true  # yfinance 不可用,Phase 2 用 KC=F 期货代理


# ============================================================
# 数据拉取配置
# ============================================================
fetch:
  proxy: auto               # Clash 代理:auto / off / clash:7897
  lookback_days: 730        # 2 年 (满足 SMA_200 预热 + ML 样本)
  interval: 1d              # 日线
  retry_times: 3            # 单 ticker 重试
  retry_delay_sec: 2
